name: Validar checkpoint 5

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java ${{ matrix.java }} e H2
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/

  mysql:
    name: Java 17 e MySQL 8.4
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: senha-apenas-para-ci
          MYSQL_DATABASE: autoescola_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psenha-apenas-para-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw
      - run: >-
          ./mvnw -B -ntp clean verify
          -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/autoescola_test
          -Dspring.datasource.username=root
          -Dspring.datasource.password=senha-apenas-para-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-mysql
          path: target/surefire-reports/
