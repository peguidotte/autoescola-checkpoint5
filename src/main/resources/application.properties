spring.application.name=AutoEscola3ESPV
spring.profiles.default=dev
server.port=${PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.error.include-stacktrace=never
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
api.security.token.secret=${JWT_SECRET}
api.security.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://127.0.0.1:5173}
api.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}
api.viacep.connect-timeout=2s
api.viacep.read-timeout=3s
api.agenda.cancelamento-antecedencia=${CANCELAMENTO_ANTECEDENCIA:24h}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
